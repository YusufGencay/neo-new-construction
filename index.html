<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Construction Homes in Florida</title>
  <meta name="description" content="Search new construction homes and communities from top Florida builders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Matches NEO search page tokens so the embed reads as one platform */
    :root {
      --background: oklch(99.5% .003 250);
      --foreground: oklch(22% .008 260);
      --primary: #ea580c;
      --border: oklch(91% .006 255);
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #neo-embed {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    body { overflow: hidden; }
    #neo-embed .neo-embed-container {
      width: 100% !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 0 !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }
    #neo-embed iframe {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <main id="neo-embed">
    <script async src="https://www.newestateonly.com/iframe-loader/load.js" data-neokey="660ec8076a92820b0131ebde"></script>
  </main>
</body>
</html>
